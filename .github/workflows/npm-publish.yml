name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and verify, but do not publish to npm, push the tag, or create the GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Tag pushes always run. Manual runs only from main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package ${NAME}@${VERSION}"

      - name: Validate version
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          TAG="${{ steps.pkg.outputs.tag }}"

          if [[ "${VERSION}" == *-* ]]; then
            echo "ERROR: Refusing to release non-stable version ${VERSION}"
            exit 1
          fi

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no '## [${VERSION}]' entry"
            exit 1
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PUSHED_TAG="${GITHUB_REF_NAME}"
            if [[ "${PUSHED_TAG}" != "${TAG}" ]]; then
              echo "ERROR: Pushed tag '${PUSHED_TAG}' does not match package.json version tag '${TAG}'"
              exit 1
            fi
          fi

      - name: Check if already published
        id: npm_check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          if [ "$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)" = "${VERSION}" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already on npm"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is not on npm yet"
          fi

      - name: Publish to npm
        if: steps.npm_check.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          if [ "${DRY_RUN}" = "1" ]; then
            echo "=== DRY_RUN: would publish ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} ==="
            npm publish --dry-run
          else
            npm publish
            echo "=== Published ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} ==="
          fi

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"

          if git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | grep -q .; then
            echo "Tag ${TAG} already exists on origin — skipping tag push"
            exit 0
          fi

          if [ "${DRY_RUN}" = "1" ]; then
            echo "=== DRY_RUN: would create and push tag ${TAG} ==="
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${{ steps.pkg.outputs.version }}"
          git push origin "${TAG}"
          echo "=== Pushed tag ${TAG} ==="

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          TAG="${{ steps.pkg.outputs.tag }}"

          NOTES=$(awk -v header="## [${VERSION}]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^[[:space:]]*$/ { if (started) blank++; next }
            found { while (blank > 0) { print ""; blank-- } print; started = 1 }
          ' CHANGELOG.md)

          if [ -z "${NOTES}" ]; then
            echo "ERROR: CHANGELOG.md '## [${VERSION}]' entry is empty"
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists — leaving it as is"
            exit 0
          fi

          if [ "${DRY_RUN}" = "1" ]; then
            echo "=== DRY_RUN: would create GitHub Release ${TAG} with these notes: ==="
            echo "${NOTES}"
            exit 0
          fi

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --title "Version ${VERSION}" --notes "${NOTES}" --verify-tag
          else
            gh release create "${TAG}" --title "Version ${VERSION}" --notes "${NOTES}" --target "${{ github.sha }}"
          fi
          echo "=== Created GitHub Release ${TAG} ==="
